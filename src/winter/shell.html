<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#202a2a"><title>Сотый километр · Берёзки</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#263332;color:#eaeae1;font:15px system-ui,sans-serif;overflow:hidden}#terrain{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header,footer,nav,#details{position:fixed;z-index:1}header{top:max(10px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;gap:8px}
button,select{font:inherit;color:inherit;background:#293532f5;border:1px solid #6d7a70;border-radius:5px;min-height:44px;padding:6px 13px;cursor:pointer}button:hover,button:focus-visible{background:#46534a}button:disabled{opacity:.46;cursor:default}
#place,.meters,#legend,#details{background:#212e2bf2;border:1px solid #53605a;border-radius:6px}#place{padding:7px 12px;color:#dbdbc4;font-weight:650}#hud{display:flex;gap:6px;align-items:center;pointer-events:auto}.meters{margin-top:4px;padding:4px 10px;font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}
footer{bottom:max(11px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:94vw}#legend,#details{font-size:13px;padding:7px 12px;text-align:center}#details{bottom:83px;left:50%;transform:translateX(-50%);pointer-events:none}
nav{bottom:14px;right:14px;display:flex;gap:6px;max-width:70vw;flex-wrap:wrap;justify-content:flex-end}body:not(.walking) nav,body:not(.walking) #stick,body:not(.walking) #stats{display:none}
#stick{position:fixed;bottom:15px;left:16px;width:92px;height:92px;border-radius:50%;border:1px solid #e0e2cc88;display:none;align-items:center;justify-content:center;background:#24332d75;touch-action:none}#stick span{width:38px;height:38px;background:#d3d6c4a6;border-radius:50%}
#radar{width:68px;height:68px;margin-top:5px;border:1px solid #66716a;border-radius:5px;pointer-events:none}@media(max-height:480px){#radar{width:46px;height:46px}}dialog{width:min(410px,94vw);max-height:84vh;overflow:auto;background:#28332f;color:#eff0df;border:1px solid #758377;border-radius:9px;box-shadow:0 16px 50px #17201e88;padding:16px}dialog::backdrop{background:#121a1966}dialog h2{font-size:19px;margin:0 0 12px}dialog p{line-height:1.45}dialog button{margin:2px}#act{background:#475647;border-color:#c4bb92}#act[hidden],#details[hidden]{display:none}
@media(pointer:coarse){#stick{display:flex}}@media(max-width:650px){header{left:7px;right:7px}#hud{gap:3px}#hud button,nav button{padding:4px 8px;font-size:13px}#place{font-size:13px;padding:7px}nav{gap:3px}.meters{max-width:55vw;font-size:11px}}
</style></head><body>
<canvas id="terrain" aria-label="Зимняя локация со станцией Сотый километр и посёлком Берёзки"></canvas>
<header><div><div id="place">Берёзки</div><div id="stats" class="meters"></div><canvas id="radar" width="84" height="84" aria-label="Мини-карта"></canvas></div><div id="hud"><button id="bag">Рюкзак</button><button id="map">Карта</button><button id="menu">Меню</button></div></header>
<footer><div id="legend">Север ↑ · Сотый километр</div></footer><div id="details" hidden role="status"></div>
<div id="stick" aria-label="Движение"><span></span></div>
<nav><button id="act" hidden></button><button id="more">Ещё</button><button id="jump">Прыжок</button><button id="stance">Присесть</button><button id="lamp">Фонарь</button><button id="hand">Руки</button><button id="reload">Зарядить</button><button id="fire" style="touch-action:none">Прицел</button></nav>
<dialog><h2></h2><section></section><button id="close">Закрыть</button></dialog>
<script>/* WINTER_GAME */</script></body></html>
