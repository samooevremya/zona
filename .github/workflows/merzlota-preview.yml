name: Build winter preview
on:
  push:
    branches: [build-merzlota-district-preview]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py berezki
        working-directory: src
      - run: |
          cp berezki.html index.html
          test "$(git hash-object index.html)" = "d45dbc8b9b00bfa852f14d42d81f65f176ad3b9b"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html berezki.html
          git commit -m "Assemble verified winter preview"
          git push origin HEAD:build-merzlota-district-preview
