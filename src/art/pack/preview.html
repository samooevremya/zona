<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Деревня • графика B</title><style>body{margin:0;background:#20251e;color:#e1ddd0;font:15px Arial}header{position:sticky;top:0;padding:16px;background:#151a17ee;z-index:2;border-bottom:1px solid #776747}h1{font-size:20px;margin:0 0 8px}button{padding:10px 16px;margin:4px;background:#323b32;color:#e7d6a9;border:1px solid #817656}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;padding:16px}article{padding:12px;background:#141c17;border:1px solid #4a5146;overflow:auto}h2{font-size:14px;color:#d2b371}canvas{display:block;background:#3e472e;margin:auto;max-width:100%;height:auto}small{color:#b3b7a9}p{max-width:900px;line-height:1.4;margin:8px 0}</style><header><h1>Деревня новичков · комплект B / v1</h1><p>Галерея ассетов, не работающая игра. Объекты показаны в игровом размере или ×2. Земля — повтор материала на площади 256×256.</p><button id="scale">Объекты: ×2</button><button id="bg">Фон: трава</button><small id="state">Загрузка…</small></header><main></main><script src="manifest.js"></script><script src="village-renderer.js"></script><script>
(async()=>{try{const art=await new VillageArt().load();let scale=2,bg=0;const cards=[];for(const [id,s] of Object.entries(VILLAGE_MANIFEST.sprites)){const card=document.createElement('article'),title=document.createElement('h2');title.textContent=id;card.append(title);const c=document.createElement('canvas');card.append(c);const note=document.createElement('small');note.textContent=s.kind==='material'?'Фрагмент → повтор с зеркалированием':s.logicalSize.join(' × ')+' игровых px';card.append(note);document.querySelector('main').append(card);cards.push({id,s,c});}function draw(){for(const {id,s,c} of cards){const mat=s.kind==='material',w=mat?256:Math.max(120,s.logicalSize[0]*scale+24),h=mat?256:Math.max(100,s.logicalSize[1]*scale+24);c.width=w*2;c.height=h*2;c.style.width=w+'px';const g=c.getContext('2d');g.scale(2,2);g.fillStyle=bg?'#c5c7be':'#3e472e';g.fillRect(0,0,w,h);if(mat)art.fill(g,id,0,0,w,h);else{if(!bg)art.fill(g,'grass',0,0,w,h);art.draw(g,id,w/2,h/2,s.logicalSize[0]*scale,s.logicalSize[1]*scale);}}}draw();document.querySelector('#scale').onclick=()=>{scale=scale===2?1:2;document.querySelector('#scale').textContent='Объекты: ×'+scale;draw();};document.querySelector('#bg').onclick=()=>{bg=1-bg;document.querySelector('#bg').textContent=bg?'Фон: светлый':'Фон: трава';draw();};document.querySelector('#state').textContent='28 элементов · загружено';}catch(e){document.querySelector('#state').textContent=e.message;}})();</script></html>
