<script>/* ошибки на экране — для проверки на телефоне без компьютера */
(function(){function show(t){var d=document.getElementById('errbox');if(!d){d=document.createElement('div');d.id='errbox';d.style.cssText='position:fixed;left:8px;right:8px;top:40px;z-index:10000;background:#5a140c;color:#fff;font:12px/1.35 monospace;padding:10px;border-radius:8px;white-space:pre-wrap;max-height:60vh;overflow:auto';document.body.appendChild(d);}d.textContent+=(d.textContent?'\n':'')+t+'  [шаг: '+(window.__bootStep||'-')+']';}
addEventListener('error',function(e){if(!e.filename&&!e.lineno)return;/* «Script error.» без файла — чужие скрипты Safari (меню «Поделиться», расширения), не игра */show('Ошибка: '+e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno);});
addEventListener('unhandledrejection',function(e){var r=e.reason;show('Ошибка: '+(r&&r.message||r)+'\n'+(r&&r.stack||'').split('\n').slice(0,4).join('\n'));});})();
</script>
