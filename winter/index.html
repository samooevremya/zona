<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#262823">
  <title>Сотый километр</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <canvas id="scene" aria-label="Зимняя локация. Управление движением — WASD или экранный джойстик."></canvas>
  <svg class="defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-health" viewBox="0 0 24 24"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z" fill="currentColor"/></symbol>
    <symbol id="i-warmth" viewBox="0 0 24 24"><path d="M9 14.5V5a3 3 0 0 1 6 0v9.5a5 5 0 1 1-6 0Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v9" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18" r="2.3" fill="currentColor"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M4 2v6c0 4 6 4 6 0V2M7 2v20M19 2c-4 3-5 6-5 11h5V2Zm0 11v9" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"/></symbol>
    <symbol id="i-water" viewBox="0 0 24 24"><path d="M12 2c-1 4-7 9-7 13.5a7 7 0 0 0 14 0C19 11 14 6 12 2Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 15a4 4 0 0 0 4 4" stroke="currentColor" stroke-linecap="round" stroke-width="1.5" fill="none"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m2 5 6-2 8 3 6-3v16l-6 3-8-3-6 2V5Zm6-2v16m8-13v16" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"/></symbol>
    <symbol id="i-empty" viewBox="0 0 24 24"><path d="M5 12c-.9-2 1-3 2.5-.8l1.1 1.5-.4-7.2c-.1-1.6 2-1.9 2.2-.1l.5 5.1.1-7.2c.1-1.7 2.3-1.7 2.4.1l.2 7 .8-6c.2-1.6 2.4-1.2 2.3.4l-.4 6.4 1.3-4.4c.5-1.5 2.5-.8 2.2.8l-1.4 8.6c-.3 2-1.2 3.4-2.7 5.2H10c-.3-2.5-2-3.1-3.3-5.7Z" fill="currentColor"/></symbol>
    <symbol id="i-knife" viewBox="0 0 24 24"><path d="M20.9 2.2c.2 5.5-3.4 10.7-8.1 13.2L9.6 12 20.9 2.2Zm-11.8 11 2.5 2.4-6.9 6.7L2 20l7.1-6.8Z" fill="currentColor"/><path d="m7.5 11.6 5.6 5.7" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-rifle" viewBox="0 0 24 24"><path d="m2 15 4-5h6l1-2h6v1h4v2h-7l-1.2 1.4 2.1 3.2-2.4 1.2-2-3.2-1.5.5-.5 3.2-2-.4.2-3.5-2.4-.2-3 3.6Z" fill="currentColor"/></symbol>
    <symbol id="i-jump" viewBox="0 0 24 24"><circle cx="15.6" cy="4.2" r="2" fill="currentColor"/><path d="m5.3 9 3.9.3 3.3-3 3.5 3 3 .5M12.7 7.6l-2.3 4.6 4.5 1.9-2.7 4.1M10.4 12.4l-2.6 3.7-4.3.1M3 21h17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sprint" viewBox="0 0 24 24"><circle cx="16" cy="4" r="2" fill="currentColor"/><path d="m6.5 10.3 3-2.9 3.6-.7 3.8 3.8 3.3.2M13.1 7.7l-3 5.4 4.2 3.3-2.1 4.7M10.1 13.1l-2.7 3.8-5 .7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-aim" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="7"/><path d="M12 1v7m0 8v7M1 12h7m8 0h7"/></g><circle cx="12" cy="12" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Z" fill="currentColor"/><path d="M15 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Z" fill="currentColor"/><path d="m16 9 6 6m0-6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-snow" viewBox="0 0 24 24"><g stroke="currentColor" fill="none" stroke-linecap="round" stroke-width="1.6"><path d="M12 2v20m-8.6-15 17.2 10m0-10-17.2 10M9.5 4.5 12 7l2.5-2.5m-5 15L12 17l2.5 2.5M4.3 10l3.5-.7L7 5.8m12.7 8.2-3.5.7.8 3.5m-12.7-4.1 3.5.7-.8 3.5m12.7-8.2-3.5-.7.8-3.5"/></g></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></symbol>
  </defs></svg>
  <main id="hud" aria-label="Игровой интерфейс">
    <section class="upper-left" aria-label="Положение и состояние">
      <button id="map-toggle" class="plate map-unit" title="Карта местности (M)" aria-label="Открыть карту местности">
        <span class="map-top"><span class="north"><i></i> С</span><span class="temp"><svg><use href="#i-snow"/></svg><b id="air-temp">−12°</b></span></span>
        <canvas id="minimap" width="240" height="147" aria-hidden="true"></canvas>
        <span class="map-foot"><strong id="clock">08:00</strong><span id="weather">Облачно</span><svg><use href="#i-map"/></svg></span>
      </button>
      <div id="vitals" class="plate vitals" aria-label="Состояние героя"></div>
      <div class="plate heat-state" id="condition" hidden></div>
    </section>
    <section class="upper-right" aria-label="Экипировка и припасы">
      <button id="equip" class="plate equip" title="Сменить предмет (Q)" aria-label="Сменить предмет в руках">
        <svg class="gear-pic"><use id="gear-pic" href="#i-empty"/></svg>
        <span><small>В руках</small><strong id="gear">Свободно</strong></span><kbd>Q</kbd>
      </button>
      <button id="jacket" class="plate equip fitting" title="Сменить куртку (J)" aria-label="Сменить куртку">
        <svg class="gear-pic" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 4 2 4-2 4 3 3 11-4 1-2-7v10H7V11l-2 7-4-1L4 6z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m8 3 2 6 2-4 2 4 2-6M12 8v12" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        <span><small>Куртка</small><strong id="jacket-name">Стартовая</strong></span><kbd>J</kbd>
      </button>
      <div class="tools">
        <button class="plate smalltool" id="eat" aria-label="Съесть паёк" title="Съесть паёк"><svg><use href="#i-food"/></svg><span id="ration-count">1</span></button>
        <button class="plate smalltool" id="drink" aria-label="Выпить воды" title="Выпить воды"><svg><use href="#i-water"/></svg><span id="water-count">1</span></button>
        <button class="plate smalltool sound" id="sound" aria-label="Включить звук" title="Включить звук"><svg><use id="sound-pic" href="#i-mute"/></svg></button>
      </div>
    </section>
    <div class="status-strip"><span id="place"></span><span id="route"></span></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div class="touch-zone" id="movement"><button id="move-pad" class="stick move-stick" aria-label="Двигаться"><span class="stick-cross"></span><span class="thumb"></span></button></div>
    <div class="right-actions">
      <button class="round action" id="jump" title="Прыжок (Пробел)" aria-label="Прыгнуть"><svg><use href="#i-jump"/></svg><span>Прыжок</span></button>
      <button class="round action" id="interact" title="Взаимодействие (E)" aria-label="Взаимодействовать"><svg><use href="#i-empty"/></svg><span>Действие</span></button>
      <button class="round action" id="sprint" title="Удерживать для бега (Shift)" aria-label="Удерживать для бега"><svg><use href="#i-sprint"/></svg><span>Бег</span></button>
      <button id="aim-pad" class="stick aim-stick" aria-label="Повернуть героя"><svg><use href="#i-aim"/></svg><span class="thumb"></span></button>
    </div>
    <div class="desktop-help"><kbd>WASD</kbd> Ходьба <i></i><kbd>Shift</kbd> Бег <i></i><kbd>M</kbd> Карта</div>
    <button id="context" class="plate context" hidden><kbd>E</kbd><svg><use href="#i-empty"/></svg><span></span></button>
  </main>
  <div id="map-overlay" class="overlay" hidden>
    <section id="map-panel" class="plate dialog map-panel" role="dialog" aria-modal="true" aria-labelledby="map-title" tabindex="-1">
      <header class="dialog-head"><div><svg><use href="#i-map"/></svg><h1 id="map-title">Карта местности · 0.3</h1></div><a class="credits-link" href="audio/credits.txt" target="_blank" rel="noopener">Звук</a><button class="close" id="map-close" aria-label="Закрыть карту"><svg><use href="#i-close"/></svg></button></header>
      <canvas id="map" width="1000" height="720" aria-label="Карта первой локации с отметкой героя и названиями мест"></canvas>
      <footer class="map-help"><span><b>WASD</b> ходьба</span><span><b>Shift</b> бег</span><span><b>Пробел</b> прыжок</span><span><b>E</b> действие</span><span><b>Q</b> предмет</span><span><b>M</b> карта</span></footer>
      <footer class="map-touch">Левый стик — ходьба. Правый — поворот.</footer>
    </section>
  </div>
  <div id="dead-overlay" class="overlay" hidden><section class="plate dialog defeat" role="dialog" aria-modal="true" aria-labelledby="defeat-title"><h2 id="defeat-title">Герой потерял сознание</h2><button id="reset" class="plate reset">Начать заново</button></section></div>
  <script src="worker.js"></script><script src="worker-glb.js"></script><script src="world.js"></script><script src="hud.js"></script><script src="weather.js"></script><script src="interiors.js"></script><script src="sound.js"></script><script src="gait.js"></script><script src="game.js"></script>
</body>
</html>
